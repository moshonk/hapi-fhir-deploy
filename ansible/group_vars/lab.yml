---
# hosts: lab is always localhost/ansible_connection=local, but interpreter
# auto-discovery doesn't reliably reuse the controller's own Python (the one
# `ansible-playbook` itself is running under, e.g. ansible/.venv/bin/python
# per docs/getting-started-benchmark-lab.md) -- it can land on a system
# python3 that lacks the pinned `kubernetes` library from
# ansible/requirements.txt, failing any kubernetes.core.k8s/k8s_info task
# with "Failed to import the required Python library (kubernetes)". Pin it
# explicitly so module execution always uses the same interpreter the
# playbook run itself is using.
ansible_python_interpreter: "{{ ansible_playbook_python }}"

lab_kubeconfig: "{{ lookup('env', 'KUBECONFIG') | default('', true) }}"
terraform_output_file: "{{ lookup('env', 'TERRAFORM_OUTPUT_FILE') | default('', true) }}"

repo_root: "{{ playbook_dir }}/../.."
chart_path: "{{ repo_root }}/charts/hapi-fhir-deploy"
values_path: "{{ chart_path }}/values.yaml"
namespace_manifest_path: "{{ repo_root }}/manifests/namespace.yaml"
autoscaling_manifest_path: "{{ repo_root }}/manifests/autoscaling/hapi-fhir-scaledobject.yaml"
runtime_rollout_patch_path: "{{ repo_root }}/manifests/runtime-rollout/hapi-fhir-deployment-rollout-patch.yaml"
runtime_values_path: "{{ repo_root }}/ansible/artifacts/generated/hapi-fhir-values.runtime.yaml"
metadata_output_path: "{{ repo_root }}/ansible/artifacts/deployment-metadata.json"

hapi_namespace: fhir
hapi_release_name: hapi-fhir
hapi_deployment_name: hapi-fhir-hapi-fhir-jpaserver
exporter_deployment_name: hapi-fhir-fhir-server-exporter
hapi_service_name: hapi-fhir-hapi-fhir-jpaserver
exporter_service_name: hapi-fhir-fhir-server-exporter
hapi_servicemonitor_name: hapi-fhir-hapi-fhir-jpaserver
exporter_servicemonitor_name: hapi-fhir-fhir-server-exporter
hapi_scaledobject_name: hapi-fhir-jpaserver

hapi_database_host: ""
hapi_database_port: 5432
hapi_database_name: hapi_fhir
hapi_database_username: hapi_fhir
hapi_database_password: "{{ lookup('env', 'HAPI_FHIR_POSTGRES_PASSWORD') | default('', true) }}"
hapi_database_secret_name: hapi-fhir-postgres
hapi_database_secret_key: password

install_prometheus_stack: true
install_grafana: true
install_metrics_server: true
install_keda: true
apply_autoscaling: true

# Empty = use the maxReplicaCount committed in the tier's own ScaledObject
# manifest (manifests/autoscaling/hapi-fhir-scaledobject*.yaml: 5 native,
# 8 pooled). Set to a number ONLY with a load test at that number and the
# connection-budget arithmetic in docs/autoscaling.md redone -- raising it
# by formula alone is exactly what collapsed throughput ~6x at 50.
hapi_max_replicas: ""

# Empty = the committed ScaledObject's minReplicaCount (2 on both tiers).
# Raise it to keep warm HAPI capacity up before load arrives. Measured on
# hapi-lab-t4 (2026-09-13): with 2, the opening ramp of every T3 run
# swamped the two minimum pods for ~3 minutes (new pods take 90-120s to be
# ready) and /metadata requests timed out, failing fhir_health_success.
# Costs idle capacity: that many pods x hapi_cpu_request stay scheduled.
# Must be a whole number between 2 (specs/003-autoscaling-connection-budget
# SC-001: never fewer than two HAPI replicas) and the effective
# maxReplicaCount; the deploy asserts both.
hapi_min_replicas: ""

# Empty = the chart's HAPI CPU request (charts/hapi-fhir-deploy/values.yaml,
# 500m). Set it near real usage under load (measured 1.3-1.6 cores/pod on
# the T3 shape) so replica scale-up leaves pods Pending and the cluster
# autoscaler adds nodes -- with 500m, 8 replicas "fit" 3 saturated nodes
# and no node is ever added. Only requests.cpu changes; limits stay.
hapi_cpu_request: ""

# Empty = Tomcat's default of 200 worker threads per HAPI pod. Measured on
# hapi-lab-t4 (2026-09-13): under T3 load single pods jammed with 200
# requests in flight against a 20-connection Hikari pool, throttled at the
# 2-core CPU limit, and stayed stuck while the load lasted (one pod in eight
# carried the whole p95/p99 tail). Set near 2x the Hikari pool (e.g. 40) to
# cap per-pod concurrency; queued connections wait without a thread.
hapi_tomcat_max_threads: ""
enable_prometheus_remote_write: true

prometheus_namespace: monitoring
prometheus_release_name: prometheus
kube_prometheus_stack_chart_version: "87.17.0"

metrics_server_namespace: kube-system
metrics_server_release_name: metrics-server
metrics_server_chart_version: "3.13.1"

keda_namespace: keda
keda_release_name: keda
keda_chart_version: "2.20.1"
keda_operator_deployment_name: keda-operator

helm_wait_timeout: 10m
rollout_timeout: 600s

# PgBouncer pooled connection tier (spec 007-pgbouncer-connection-pooling).
# Opt-in and disabled by default: when enable_pgbouncer is false, deployment
# behavior is unchanged from the native tier (spec 003).
enable_pgbouncer: false
pgbouncer_service_path: "{{ repo_root }}/manifests/pgbouncer/service.yaml"
pgbouncer_pdb_path: "{{ repo_root }}/manifests/pgbouncer/poddisruptionbudget.yaml"
pgbouncer_deployment_template: ../templates/pgbouncer-deployment.runtime.yaml.j2
pgbouncer_deployment_output_path: "{{ repo_root }}/ansible/artifacts/generated/pgbouncer-deployment.runtime.yaml"
pgbouncer_scaledobject_path: "{{ repo_root }}/manifests/autoscaling/hapi-fhir-scaledobject-pgbouncer.yaml"
pgbouncer_values_path: "{{ chart_path }}/values-pgbouncer-tier.yaml"

pgbouncer_deployment_name: hapi-fhir-pgbouncer
pgbouncer_service_name: hapi-fhir-pgbouncer
pgbouncer_scaledobject_name: hapi-fhir-pgbouncer

# Pinned per Constitution Principle III (no `latest`). >= 1.21 for
# MAX_PREPARED_STATEMENTS / protocol-level prepared-statement pooling
# support in transaction mode (research.md Decision 3).
pgbouncer_image: "docker.io/edoburu/pgbouncer:v1.25.2-p0@sha256:68969403ee54dbf98601b49a1e92db644a9fdeed5c40969f7f0adce5193ac5b8"
pgbouncer_listen_port: 5432

# Pooled connection-budget inputs (contracts/connection-budget-formula.md).
# pgbouncer_server_connections = default_pool_size * replica_count
#                               = 20 * 2 = 40 <= (postgres_max_connections=100 - reserved_connections=50)
pgbouncer_replica_count: 2
pgbouncer_default_pool_size: 20
pgbouncer_max_client_conn: 1000
pgbouncer_max_prepared_statements: 200

# PgBouncer CPU per pod (ansible/templates/pgbouncer-deployment.runtime.yaml.j2).
# Empty = 100m request / 500m limit. PgBouncer is single-threaded, so a limit
# above ~1000m buys nothing; add replicas for more. Measured on hapi-lab-t4
# (2026-09-13): at true T3 load both pods sat at the 500m limit, throttled
# ~50%, with clients queueing. Raise the request with the limit so the
# scheduler reserves the CPU -- a low request lets pods pack onto saturated
# nodes, the same trap as hapi_cpu_request. The request must not exceed the
# limit (Kubernetes rejects the Deployment).
pgbouncer_cpu_request: ""
pgbouncer_cpu_limit: ""

# scram-sha-256, not the image's own default (md5): the edoburu/pgbouncer
# entrypoint only writes the plaintext password into userlist.txt (needed for
# PgBouncer to complete SCRAM auth against the backend Postgres server) when
# AUTH_TYPE is "plain" or "scram-sha-256" -- otherwise it MD5-hashes the
# password, which a scram-sha-256-enforcing backend (e.g. Cloud SQL Postgres
# 16 with the default password_encryption) rejects with "cannot do SCRAM
# authentication: wrong password type".
pgbouncer_auth_type: scram-sha-256
