---
- name: Deploy PgBouncer pooled connection tier
  hosts: lab
  gather_facts: false
  vars_files:
    - ../group_vars/lab.yml
  environment: "{{ {'KUBECONFIG': lab_kubeconfig} if (lab_kubeconfig | length > 0) else {} }}"
  pre_tasks:
    - name: Require kubeconfig for PgBouncer deployment
      ansible.builtin.assert:
        that:
          - lab_kubeconfig | length > 0
        fail_msg: "Set KUBECONFIG or pass lab_kubeconfig before running the Ansible lab playbooks."

    - name: Initialize Terraform output data
      ansible.builtin.set_fact:
        terraform_outputs: {}

    - name: Check Terraform output file when provided
      ansible.builtin.stat:
        path: "{{ terraform_output_file }}"
      register: terraform_output_stat
      when: terraform_output_file | length > 0

    - name: Require provided Terraform output file to exist
      ansible.builtin.assert:
        that:
          - terraform_output_stat.stat.exists
        fail_msg: "terraform_output_file was provided but does not exist: {{ terraform_output_file }}"
      when: terraform_output_file | length > 0

    - name: Read Terraform output file
      ansible.builtin.slurp:
        path: "{{ terraform_output_file }}"
      register: terraform_output_slurp
      no_log: true
      when: terraform_output_file | length > 0

    - name: Parse Terraform output file
      ansible.builtin.set_fact:
        terraform_outputs: "{{ terraform_output_slurp.content | b64decode | from_json }}"
      no_log: true
      when: terraform_output_file | length > 0

    # PgBouncer resolves the same database connection inputs as
    # 20-deploy-hapi-fhir.yml. Facts set in one imported playbook do not
    # carry over to another (no fact caching is configured in this repo),
    # so this block is intentionally duplicated rather than shared, to
    # keep each numbered playbook self-contained per existing convention.
    - name: Resolve database connection inputs
      ansible.builtin.set_fact:
        lab_database_endpoint: "{{ hapi_database_host | default(terraform_outputs.database_endpoint.value | default(''), true) }}"
        lab_database_port: "{{ hapi_database_port | default(terraform_outputs.database_port.value | default(5432), true) }}"
        lab_database_name: "{{ hapi_database_name | default(terraform_outputs.database_name.value | default('hapi_fhir'), true) }}"
        lab_database_username: "{{ hapi_database_username | default(terraform_outputs.database_username.value | default('hapi_fhir'), true) }}"
        lab_database_password: "{{ hapi_database_password | default(terraform_outputs.database_password.value | default(''), true) }}"
      no_log: true

    - name: Require database endpoint and generated password
      ansible.builtin.assert:
        that:
          - lab_database_endpoint | length > 0
          - lab_database_name | length > 0
          - lab_database_username | length > 0
          - lab_database_password | length > 0
        fail_msg: "Provide hapi_database_host and hapi_database_password, or pass terraform_output_file from issue #19."
      no_log: true

  tasks:
    # Re-checked against this lab's EFFECTIVE values before anything is
    # rendered: CI only ever sees the committed group_vars defaults, while
    # the pool size, replica count, CPU and the database's max_connections
    # can all be overridden per lab from the Lab Control UI.
    - name: Resolve effective PgBouncer sizing and the PostgreSQL connection budget
      ansible.builtin.set_fact:
        # Same fallbacks the PgBouncer Deployment template renders.
        pgbouncer_effective_cpu_request: "{{ (pgbouncer_cpu_request | default('') | string | trim) or '100m' }}"
        pgbouncer_effective_cpu_limit: "{{ (pgbouncer_cpu_limit | default('') | string | trim) or '500m' }}"
        lab_postgres_max_connections: "{{ terraform_outputs.database_max_connections.value | default(postgres_max_connections) | int }}"
        lab_postgres_connection_budget: "{{ (terraform_outputs.database_max_connections.value | default(postgres_max_connections) | int) - (postgres_reserved_connections | int) }}"

    - name: Refuse malformed PgBouncer sizing
      ansible.builtin.assert:
        that:
          - (pgbouncer_replica_count | string | trim) is match('^[1-9][0-9]*$')
          - (pgbouncer_default_pool_size | string | trim) is match('^[1-9][0-9]*$')
          - pgbouncer_effective_cpu_request is match('^([0-9]+m|[0-9]+([.][0-9]+)?)$')
          - pgbouncer_effective_cpu_limit is match('^([0-9]+m|[0-9]+([.][0-9]+)?)$')
        fail_msg: >-
          pgbouncer_replica_count and pgbouncer_default_pool_size must be whole numbers
          of at least 1, and PgBouncer CPU values Kubernetes CPU quantities such as
          1000m or 1 (got replicas '{{ pgbouncer_replica_count }}', pool
          '{{ pgbouncer_default_pool_size }}', request '{{ pgbouncer_effective_cpu_request }}',
          limit '{{ pgbouncer_effective_cpu_limit }}').
        quiet: true

    - name: Refuse a PgBouncer CPU request above its limit
      vars:
        request_millicores: "{{ (pgbouncer_effective_cpu_request[:-1] | int) if pgbouncer_effective_cpu_request.endswith('m') else ((pgbouncer_effective_cpu_request | float) * 1000) | round | int }}"
        limit_millicores: "{{ (pgbouncer_effective_cpu_limit[:-1] | int) if pgbouncer_effective_cpu_limit.endswith('m') else ((pgbouncer_effective_cpu_limit | float) * 1000) | round | int }}"
      ansible.builtin.assert:
        that:
          - (request_millicores | int) <= (limit_millicores | int)
        fail_msg: >-
          PgBouncer CPU request {{ pgbouncer_effective_cpu_request }} exceeds its limit
          {{ pgbouncer_effective_cpu_limit }} (Kubernetes would reject the Deployment).
        quiet: true

    - name: Refuse PgBouncer server connections beyond the PostgreSQL budget
      ansible.builtin.assert:
        that:
          - ((pgbouncer_default_pool_size | int) * (pgbouncer_replica_count | int)) <= (lab_postgres_connection_budget | int)
        fail_msg: >-
          pgbouncer_default_pool_size {{ pgbouncer_default_pool_size }} x pgbouncer_replica_count
          {{ pgbouncer_replica_count }} = {{ (pgbouncer_default_pool_size | int) * (pgbouncer_replica_count | int) }}
          real PostgreSQL connections exceeds max_connections {{ lab_postgres_max_connections }}
          - {{ postgres_reserved_connections }} reserved = {{ lab_postgres_connection_budget }}.
          Lower the pool size or replicas, or raise db_max_connections.
        quiet: true

    - name: Ensure local generated artifact directory exists
      ansible.builtin.file:
        path: "{{ pgbouncer_deployment_output_path | dirname }}"
        state: directory
        mode: "0700"

    - name: Apply HAPI namespace manifest
      kubernetes.core.k8s:
        state: present
        src: "{{ namespace_manifest_path }}"

    # This play runs before 20-deploy-hapi-fhir.yml (per playbooks/lab.yml's
    # import order, PgBouncer must exist before HAPI FHIR's datasource can
    # point at its Service), but the PgBouncer Deployment's DB_PASSWORD reads
    # from the same Secret that 20-deploy-hapi-fhir.yml creates. Create it
    # here too (idempotent: state=present, both plays converge on the same
    # definition) so PgBouncer isn't left referencing a Secret that doesn't
    # exist yet.
    - name: Create runtime PostgreSQL Secret
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ hapi_database_secret_name }}"
            namespace: "{{ hapi_namespace }}"
            labels:
              app.kubernetes.io/name: hapi-fhir-postgres
              app.kubernetes.io/part-of: hapi-fhir
          type: Opaque
          stringData: "{{ {hapi_database_secret_key: lab_database_password} }}"
      no_log: true

    - name: Render PgBouncer Deployment (reuses the existing hapi-fhir-postgres Secret for its DB_PASSWORD)
      ansible.builtin.template:
        src: "{{ pgbouncer_deployment_template }}"
        dest: "{{ pgbouncer_deployment_output_path }}"
        mode: "0600"

    - name: Apply PgBouncer Deployment
      kubernetes.core.k8s:
        state: present
        src: "{{ pgbouncer_deployment_output_path }}"
        wait: true
        wait_timeout: 300

    - name: Apply PgBouncer Service
      kubernetes.core.k8s:
        state: present
        src: "{{ pgbouncer_service_path }}"

    - name: Apply PgBouncer PodDisruptionBudget
      kubernetes.core.k8s:
        state: present
        src: "{{ pgbouncer_pdb_path }}"
