---
- name: Deploy HAPI FHIR Helm baseline
  hosts: lab
  gather_facts: false
  vars_files:
    - ../group_vars/lab.yml
  environment: "{{ {'KUBECONFIG': lab_kubeconfig} if (lab_kubeconfig | length > 0) else {} }}"
  pre_tasks:
    - name: Require kubeconfig for HAPI deployment
      ansible.builtin.assert:
        that:
          - lab_kubeconfig | length > 0
        fail_msg: "Set KUBECONFIG or pass lab_kubeconfig before running the Ansible lab playbooks."

    - name: Initialize Terraform output data
      ansible.builtin.set_fact:
        terraform_outputs: {}

    - name: Check Terraform output file when provided
      ansible.builtin.stat:
        path: "{{ terraform_output_file }}"
      register: terraform_output_stat
      when: terraform_output_file | length > 0

    - name: Require provided Terraform output file to exist
      ansible.builtin.assert:
        that:
          - terraform_output_stat.stat.exists
        fail_msg: "terraform_output_file was provided but does not exist: {{ terraform_output_file }}"
      when: terraform_output_file | length > 0

    - name: Read Terraform output file
      ansible.builtin.slurp:
        path: "{{ terraform_output_file }}"
      register: terraform_output_slurp
      no_log: true
      when: terraform_output_file | length > 0

    - name: Parse Terraform output file
      ansible.builtin.set_fact:
        terraform_outputs: "{{ terraform_output_slurp.content | b64decode | from_json }}"
      no_log: true
      when: terraform_output_file | length > 0

    - name: Resolve database connection inputs
      ansible.builtin.set_fact:
        lab_database_endpoint: "{{ hapi_database_host | default(terraform_outputs.database_endpoint.value | default(''), true) }}"
        lab_database_port: "{{ hapi_database_port | default(terraform_outputs.database_port.value | default(5432), true) }}"
        lab_database_name: "{{ hapi_database_name | default(terraform_outputs.database_name.value | default('hapi_fhir'), true) }}"
        lab_database_username: "{{ hapi_database_username | default(terraform_outputs.database_username.value | default('hapi_fhir'), true) }}"
        lab_database_password: "{{ hapi_database_password | default(terraform_outputs.database_password.value | default(''), true) }}"
      no_log: true

    - name: Require database endpoint and generated password
      ansible.builtin.assert:
        that:
          - lab_database_endpoint | length > 0
          - lab_database_name | length > 0
          - lab_database_username | length > 0
          - lab_database_password | length > 0
        fail_msg: "Provide hapi_database_host and hapi_database_password, or pass terraform_output_file from issue #19."
      no_log: true

  tasks:
    - name: Ensure local generated artifact directory exists
      ansible.builtin.file:
        path: "{{ runtime_values_path | dirname }}"
        state: directory
        mode: "0700"

    - name: Resolve Helm values file order
      ansible.builtin.set_fact:
        # values.yaml (base, never modified by spec 007) -> values-pgbouncer-tier.yaml
        # (additive, only when enabled) -> runtime_values_path (always last: it
        # supplies the per-lab datasource wiring, including which host wins).
        hapi_values_files: >-
          {{
            [values_path]
            + ([pgbouncer_values_path] if (enable_pgbouncer | default(false) | bool) else [])
            + [runtime_values_path]
          }}

    - name: Apply HAPI namespace manifest
      kubernetes.core.k8s:
        state: present
        src: "{{ namespace_manifest_path }}"

    - name: Create runtime PostgreSQL Secret
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ hapi_database_secret_name }}"
            namespace: "{{ hapi_namespace }}"
            labels:
              app.kubernetes.io/name: hapi-fhir-postgres
              app.kubernetes.io/part-of: hapi-fhir
          type: Opaque
          stringData: "{{ {hapi_database_secret_key: lab_database_password} }}"
      no_log: true

    - name: Render runtime Helm values without secret material
      ansible.builtin.template:
        src: ../templates/hapi-fhir-values.runtime.yaml.j2
        dest: "{{ runtime_values_path }}"
        mode: "0600"

    # charts/hapi-fhir-deploy/Chart.yaml's own dependencies (hapi-fhir-jpaserver,
    # fhir-server-exporter) come from these two upstream repos, distinct from
    # the cluster add-on repos 00-install-addons.yml registers (prometheus-community,
    # metrics-server, kedacore). `helm dependency build` fails outright on a
    # fresh Helm install/machine that has never run `helm repo add` for them
    # (matches .github/workflows/ci.yml's pinned repo URLs).
    - name: Add HAPI FHIR chart dependency Helm repositories
      kubernetes.core.helm_repository:
        name: "{{ item.name }}"
        repo_url: "{{ item.repo_url }}"
      loop:
        - name: hapifhir
          repo_url: https://hapifhir.github.io/hapi-fhir-jpaserver-starter/
        - name: chgl
          repo_url: https://chgl.github.io/charts

    - name: Build HAPI FHIR Helm dependencies
      ansible.builtin.command:
        cmd: helm dependency build charts/hapi-fhir-deploy
        chdir: "{{ repo_root }}"
      changed_when: false

    - name: Install or upgrade HAPI FHIR Helm release
      kubernetes.core.helm:
        name: "{{ hapi_release_name }}"
        chart_ref: "{{ chart_path }}"
        release_namespace: "{{ hapi_namespace }}"
        values_files: "{{ hapi_values_files }}"
        wait: true
        wait_timeout: "{{ helm_wait_timeout }}"

    - name: Apply runtime rollout patch
      kubernetes.core.k8s:
        state: patched
        namespace: "{{ hapi_namespace }}"
        merge_type:
          - strategic-merge
        definition: >-
          {{
            {
              'apiVersion': 'apps/v1',
              'kind': 'Deployment',
              'metadata': {
                'name': hapi_deployment_name,
                'namespace': hapi_namespace
              }
            } | combine(lookup('file', runtime_rollout_patch_path) | from_yaml, recursive=True)
          }}

    # An EMPTY hapi_max_replicas (the default) means "use whatever the
    # committed manifest says" -- the manifests stay the readable,
    # reviewed source of truth for each tier's connection-budget ceiling
    # (5 native / 8 pooled), and this override exists only so an operator
    # can walk that ceiling up a step at a time from the Lab Control UI
    # without hand-editing a manifest mid-experiment. Same
    # lookup()|from_yaml|combine shape the runtime rollout patch above
    # already uses, rather than turning the manifests into .j2 templates.
    # hapi_min_replicas follows the same empty-means-manifest rule. Raising
    # the floor keeps warm capacity in place before load arrives: on
    # hapi-lab-t4 (2026-09-13) every T3 run failed fhir_health_success
    # because the 2 minimum replicas (one of them freshly cold after an idle
    # cluster-autoscaler scale-down) absorbed the opening ramp alone for ~3
    # minutes while new pods took 90-120s each to become ready, and /metadata
    # requests hit k6's 60s timeout.
    - name: Resolve optional KEDA minReplicaCount / maxReplicaCount overrides
      ansible.builtin.set_fact:
        hapi_scaledobject_override: >-
          {{
            {'spec': (
              ({'minReplicaCount': hapi_min_replicas | int}
                if (hapi_min_replicas | default('') | string | trim | length > 0) else {})
              | combine(
                ({'maxReplicaCount': hapi_max_replicas | int}
                  if (hapi_max_replicas | default('') | string | trim | length > 0) else {}))
            )}
            if ((hapi_min_replicas | default('') | string | trim | length > 0)
                or (hapi_max_replicas | default('') | string | trim | length > 0))
            else {}
          }}

    - name: Refuse a minReplicaCount outside 1..maxReplicaCount for the active tier
      vars:
        hapi_scaledobject_effective: >-
          {{
            lookup('file', pgbouncer_scaledobject_path
                   if (enable_pgbouncer | default(false) | bool)
                   else autoscaling_manifest_path)
            | from_yaml
            | combine(hapi_scaledobject_override, recursive=True)
          }}
      ansible.builtin.assert:
        that:
          - (hapi_scaledobject_effective.spec.minReplicaCount | int) >= 1
          - (hapi_scaledobject_effective.spec.minReplicaCount | int) <= (hapi_scaledobject_effective.spec.maxReplicaCount | int)
        fail_msg: >-
          minReplicaCount {{ hapi_scaledobject_effective.spec.minReplicaCount }} must be
          between 1 and maxReplicaCount {{ hapi_scaledobject_effective.spec.maxReplicaCount }}
          (hapi_min_replicas='{{ hapi_min_replicas | default('') }}',
          hapi_max_replicas='{{ hapi_max_replicas | default('') }}').
        quiet: true
      when: apply_autoscaling | bool

    - name: Report the KEDA minReplicaCount actually being applied
      ansible.builtin.debug:
        msg: >-
          minReplicaCount overridden to {{ hapi_min_replicas }} -- that many warm HAPI
          pods (each requesting hapi_cpu_request) stay up even when idle, so the
          cluster keeps the nodes to hold them.
      when: hapi_min_replicas | default('') | string | trim | length > 0

    - name: Report the KEDA maxReplicaCount actually being applied
      ansible.builtin.debug:
        msg: >-
          maxReplicaCount overridden to {{ hapi_max_replicas }} (connection budget is
          NOT recomputed for you -- see docs/autoscaling.md; the native tier's
          formula is maxReplicas <= floor((max_connections - reserved) / hikari_pool),
          and the pooled tier's real ceiling is pgbouncer_server_connections, not
          replica count).
      when: hapi_max_replicas | default('') | string | trim | length > 0

    - name: Apply HAPI FHIR KEDA autoscaler (native connection-budget ceiling)
      kubernetes.core.k8s:
        state: present
        definition: >-
          {{
            lookup('file', autoscaling_manifest_path)
            | from_yaml
            | combine(hapi_scaledobject_override, recursive=True)
          }}
      when: (apply_autoscaling | bool) and not (enable_pgbouncer | default(false) | bool)

    - name: Apply HAPI FHIR KEDA autoscaler (pooled connection-budget ceiling)
      kubernetes.core.k8s:
        state: present
        definition: >-
          {{
            lookup('file', pgbouncer_scaledobject_path)
            | from_yaml
            | combine(hapi_scaledobject_override, recursive=True)
          }}
      when: (apply_autoscaling | bool) and (enable_pgbouncer | default(false) | bool)
