---
- name: Install benchmark lab cluster add-ons
  hosts: lab
  gather_facts: false
  vars_files:
    - ../group_vars/lab.yml
  environment: "{{ {'KUBECONFIG': lab_kubeconfig} if (lab_kubeconfig | length > 0) else {} }}"
  pre_tasks:
    - name: Require kubeconfig for add-on installation
      ansible.builtin.assert:
        that:
          - lab_kubeconfig | length > 0
        fail_msg: "Set KUBECONFIG or pass lab_kubeconfig before running the Ansible lab playbooks."

  tasks:
    - name: Add pinned add-on Helm repositories
      kubernetes.core.helm_repository:
        name: "{{ item.name }}"
        repo_url: "{{ item.repo_url }}"
      loop:
        - name: prometheus-community
          repo_url: https://prometheus-community.github.io/helm-charts
        - name: metrics-server
          repo_url: https://kubernetes-sigs.github.io/metrics-server
        - name: kedacore
          repo_url: https://kedacore.github.io/charts

    - name: Install Prometheus Operator and Prometheus
      kubernetes.core.helm:
        name: "{{ prometheus_release_name }}"
        chart_ref: prometheus-community/kube-prometheus-stack
        chart_version: "{{ kube_prometheus_stack_chart_version }}"
        release_namespace: "{{ prometheus_namespace }}"
        create_namespace: true
        update_repo_cache: true
        wait: true
        wait_timeout: "{{ helm_wait_timeout }}"
        values:
          alertmanager:
            enabled: false
          defaultRules:
            create: false
          grafana:
            # Auto-generated admin password (kube-prometheus-stack default,
            # not set here): kubectl -n monitoring get secret
            # prometheus-grafana -o jsonpath='{.data.admin-password}' |
            # base64 -d. Admin user defaults to "admin".
            enabled: "{{ install_grafana | bool }}"
          prometheus:
            prometheusSpec:
              # kube-prometheus-stack's chart default only selects
              # ServiceMonitors/PodMonitors carrying `release: {{ .Release.Name }}`
              # (here, "release: prometheus"). The official HAPI FHIR chart's own
              # ServiceMonitor doesn't carry that label (it's an unrelated,
              # separately-versioned chart per this repo's wrapper-chart
              # convention), so without this override Prometheus never scrapes
              # it -- silently starving the KEDA "hapi-fhir-actuator" Prometheus
              # trigger of data (empty query result, ScaledObject stuck
              # Ready=False) with no error pointing at the actual cause.
              serviceMonitorSelectorNilUsesHelmValues: false
              podMonitorSelectorNilUsesHelmValues: false
      when: install_prometheus_stack | bool

    # GKE (and some other managed offerings) ships its own metrics-server in
    # kube-system as an addon-manager-reconciled component -- a ServiceAccount
    # named "metrics-server" already exists there before this playbook ever
    # runs. `helm upgrade -i` refuses to adopt a resource it didn't create
    # (missing meta.helm.sh/* ownership annotations), so installing the
    # community chart on top of it fails outright; forcibly adopting it would
    # just have the cluster's addon manager fight Helm over it afterwards.
    # Detect that case up front and skip the chart install -- the cluster
    # already has working metrics-server functionality for HPA/KEDA.
    - name: Check for a pre-existing metrics-server ServiceAccount
      kubernetes.core.k8s_info:
        api_version: v1
        kind: ServiceAccount
        name: "{{ metrics_server_release_name }}"
        namespace: "{{ metrics_server_namespace }}"
      register: existing_metrics_server_sa
      when: install_metrics_server | bool

    - name: Determine whether metrics-server is already provided outside Helm
      ansible.builtin.set_fact:
        metrics_server_externally_managed: >-
          {{
            (existing_metrics_server_sa.resources | default([]) | length > 0) and
            ('meta.helm.sh/release-name' not in (existing_metrics_server_sa.resources[0].metadata.annotations | default({})))
          }}
      when: install_metrics_server | bool

    - name: Note pre-existing, non-Helm-managed metrics-server
      ansible.builtin.debug:
        msg: >-
          A ServiceAccount named "{{ metrics_server_release_name }}" already exists in
          "{{ metrics_server_namespace }}" and isn't owned by Helm (e.g. GKE's built-in,
          addon-manager-reconciled metrics-server). Skipping the metrics-server Helm
          chart install to avoid an ownership conflict and to avoid fighting the
          cluster's own addon reconciliation.
      when: install_metrics_server | bool and metrics_server_externally_managed

    - name: Install Metrics Server
      kubernetes.core.helm:
        name: "{{ metrics_server_release_name }}"
        chart_ref: metrics-server/metrics-server
        chart_version: "{{ metrics_server_chart_version }}"
        release_namespace: "{{ metrics_server_namespace }}"
        update_repo_cache: true
        wait: true
        wait_timeout: "{{ helm_wait_timeout }}"
      when: install_metrics_server | bool and not (metrics_server_externally_managed | default(false))

    - name: Install KEDA
      kubernetes.core.helm:
        name: "{{ keda_release_name }}"
        chart_ref: kedacore/keda
        chart_version: "{{ keda_chart_version }}"
        release_namespace: "{{ keda_namespace }}"
        create_namespace: true
        update_repo_cache: true
        wait: true
        wait_timeout: "{{ helm_wait_timeout }}"
      when: install_keda | bool

    - name: Wait for ServiceMonitor CRD
      kubernetes.core.k8s_info:
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        name: servicemonitors.monitoring.coreos.com
      register: servicemonitor_crd
      until: servicemonitor_crd.resources | default([]) | length == 1
      retries: 30
      delay: 10
      when: install_prometheus_stack | bool

    - name: Wait for KEDA ScaledObject CRD
      kubernetes.core.k8s_info:
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        name: scaledobjects.keda.sh
      register: scaledobject_crd
      until: scaledobject_crd.resources | default([]) | length == 1
      retries: 30
      delay: 10
      when: install_keda | bool
