---
- name: Wait for HAPI FHIR benchmark lab readiness
  hosts: lab
  gather_facts: false
  vars_files:
    - ../group_vars/lab.yml
  environment: "{{ {'KUBECONFIG': lab_kubeconfig} if (lab_kubeconfig | length > 0) else {} }}"
  pre_tasks:
    - name: Require kubeconfig for readiness checks
      ansible.builtin.assert:
        that:
          - lab_kubeconfig | length > 0
        fail_msg: "Set KUBECONFIG or pass lab_kubeconfig before running readiness checks."

  tasks:
    - name: Wait for Kubernetes deployments
      ansible.builtin.command:
        argv:
          - kubectl
          - -n
          - "{{ item.namespace }}"
          - rollout
          - status
          - "deploy/{{ item.name }}"
          - "--timeout={{ rollout_timeout }}"
      changed_when: false
      loop:
        - namespace: "{{ hapi_namespace }}"
          name: "{{ hapi_deployment_name }}"
          enabled: true
        - namespace: "{{ hapi_namespace }}"
          name: "{{ exporter_deployment_name }}"
          enabled: true
        - namespace: "{{ keda_namespace }}"
          name: "{{ keda_operator_deployment_name }}"
          enabled: "{{ install_keda }}"
      when: item.enabled | bool

    # Not a `deploy/metrics-server` rollout-status wait like the loop above:
    # 00-install-addons.yml skips the Helm chart (and its "metrics-server"
    # Deployment name) when the cluster already ships
    # its own metrics-server (e.g. GKE's addon-manager-reconciled
    # "metrics-server-v1.35.1"), so the Deployment name isn't stable across
    # providers/install paths. The metrics.k8s.io APIService reporting
    # Available is the actual capability HPA/KEDA depend on, regardless of
    # which Deployment serves it.
    - name: Wait for metrics-server API to be available
      kubernetes.core.k8s_info:
        api_version: apiregistration.k8s.io/v1
        kind: APIService
        name: v1beta1.metrics.k8s.io
      register: metrics_server_apiservice
      until: >-
        metrics_server_apiservice.resources | default([]) | length == 1 and
        (metrics_server_apiservice.resources[0].status.conditions | default([]) |
          selectattr('type', 'equalto', 'Available') | selectattr('status', 'equalto', 'True') | list | length) == 1
      retries: 30
      delay: 10
      when: install_metrics_server | bool

    - name: Wait for HAPI service to expose FHIR and Actuator ports
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Service
        namespace: "{{ hapi_namespace }}"
        name: "{{ hapi_service_name }}"
      register: hapi_service_info
      until:
        - hapi_service_info.resources | length == 1
        - 8080 in (hapi_service_info.resources[0].spec.ports | map(attribute='port') | list)
        - 8081 in (hapi_service_info.resources[0].spec.ports | map(attribute='port') | list)
      retries: 30
      delay: 10

    - name: Wait for exporter service
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Service
        namespace: "{{ hapi_namespace }}"
        name: "{{ exporter_service_name }}"
      register: exporter_service_info
      until: exporter_service_info.resources | length == 1
      retries: 30
      delay: 10

    - name: Wait for HAPI ServiceMonitor
      kubernetes.core.k8s_info:
        api_version: monitoring.coreos.com/v1
        kind: ServiceMonitor
        namespace: "{{ hapi_namespace }}"
        name: "{{ hapi_servicemonitor_name }}"
      register: hapi_servicemonitor_info
      until: hapi_servicemonitor_info.resources | length == 1
      retries: 30
      delay: 10
      when: install_prometheus_stack | bool

    - name: Wait for exporter ServiceMonitor
      kubernetes.core.k8s_info:
        api_version: monitoring.coreos.com/v1
        kind: ServiceMonitor
        namespace: "{{ hapi_namespace }}"
        name: "{{ exporter_servicemonitor_name }}"
      register: exporter_servicemonitor_info
      until: exporter_servicemonitor_info.resources | length == 1
      retries: 30
      delay: 10
      when: install_prometheus_stack | bool

    - name: Wait for KEDA ScaledObject to become ready
      ansible.builtin.command:
        argv:
          - kubectl
          - -n
          - "{{ hapi_namespace }}"
          - get
          - scaledobject
          - "{{ hapi_scaledobject_name }}"
          - -o
          - "jsonpath={.status.conditions[?(@.type=='Ready')].status}"
      register: scaledobject_ready
      changed_when: false
      failed_when: false
      until:
        - scaledobject_ready.rc == 0
        - scaledobject_ready.stdout == "True"
      retries: 30
      delay: 10
      when: apply_autoscaling | bool

    - name: Verify Kubernetes Metrics API is available
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - --raw
          - /apis/metrics.k8s.io/v1beta1/nodes
      register: metrics_api_ready
      changed_when: false
      failed_when: false
      until: metrics_api_ready.rc == 0
      retries: 30
      delay: 10
      when: install_metrics_server | bool
