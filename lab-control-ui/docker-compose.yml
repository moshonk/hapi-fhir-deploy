services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # expose-fhir/expose-prometheus/expose-grafana run `kubectl port-forward
    # --address 0.0.0.0` *inside* this container. Without host networking,
    # that bind only exists in the container's own private network
    # namespace -- invisible to the host's real interfaces, so the GCP
    # firewall rule these actions also open has nothing to actually reach
    # (discovered live: a "successful" expose-fhir action, open firewall
    # rule, yet "connection refused" from outside -- nothing was listening
    # on the host at all). Host networking makes any port scripts/lab binds
    # inside the container immediately visible on the host, matching
    # exactly how expose-* was built and verified (run directly on the
    # host, not containerized). See nginx/nginx.conf's proxy_pass comment
    # for the corresponding change this requires on the nginx side.
    network_mode: host
    environment:
      # Required, no default -- the app itself refuses to start without this
      # (config.ts's fail-closed guard, spec.md Edge Case 5). Set it in .env.
      LAB_UI_SHARED_SECRET: ${LAB_UI_SHARED_SECRET:?set LAB_UI_SHARED_SECRET in lab-control-ui/.env}
      LAB_REPO_ROOT: /repo
      LAB_UI_PORT: "3000"
      # The frontend is built INTO the image (Dockerfile), not read from the
      # /repo bind mount above -- see config.ts's frontendDistPath doc
      # comment for why the two can't be derived from one another here.
      LAB_UI_FRONTEND_DIST: /app/lab-control-ui/frontend/dist
      # Set to "true" once nginx (or whatever's in front of it) terminates
      # real HTTPS, so the session cookie gets the Secure flag.
      LAB_UI_COOKIE_SECURE: ${LAB_UI_COOKIE_SECURE:-false}
    volumes:
      # The actual scripts/lab checkout this container operates against --
      # see the Dockerfile's header note. Read-write: scripts/lab writes
      # Terraform state/outputs, kubeconfigs, and seed/benchmark run
      # artifacts under the already-gitignored ansible/artifacts/lab/ tree,
      # and this is also where the app's own SQLite DB and captured run
      # logs live (config.ts defaults both under LAB_REPO_ROOT).
      - ..:/repo
      # GCP Application Default Credentials, so `gcloud auth application-default
      # login` run on the HOST is visible inside the container too. Read-write
      # (NOT :ro, despite the container never running the login flow itself):
      # `gcloud` writes to its config dir on nearly every invocation, not just
      # login -- it refreshes/rewrites credentials.db's cached access token,
      # and always tries to create a per-invocation log file under
      # logs/YYYY.MM.DD/. A read-only mount makes expose-fhir/expose-prometheus/
      # expose-grafana (and anything else shelling out to `gcloud compute ...`)
      # fail outright with "Read-only file system: .../credentials.db" --
      # discovered via a real failed expose-grafana run, not a theoretical
      # concern. This is the same GCP account's own credentials either way;
      # read-write here doesn't grant the container anything it couldn't
      # already do by driving `gcloud`/`terraform` themselves.
      - ${GCLOUD_CONFIG_DIR:-${HOME}/.config/gcloud}:/root/.config/gcloud
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:1.27.5-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    # app is on network_mode: host (see its comment above), so it's no
    # longer reachable by the compose-network service name `app` -- nginx
    # (still on the default bridge network) needs this to resolve to the
    # host's real IP instead. Requires Docker Engine >= 20.10 for the
    # `host-gateway` special value (this host runs 29.1.3).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # fullchain.pem + privkey.pem for hapilab.intellisoftkenya.com --
      # gitignored (lab-control-ui/nginx/certs/), see README.md's TLS section.
      - ${TLS_CERT_DIR:-./nginx/certs}:/etc/nginx/certs:ro
