# Reverse proxy for the Lab Control UI (research.md §7 -- the app itself
# only ever binds an internal port; reaching port 80/443 is this proxy's
# job). Mounted into the official nginx image at
# /etc/nginx/conf.d/default.conf, so this file is a server block only --
# the surrounding http{} context comes from the base image's own
# /etc/nginx/nginx.conf, which already `include`s conf.d/*.conf.
#
# TLS is live for hapilab.intellisoftkenya.com using a real wildcard
# certificate (*.intellisoftkenya.com, DigiCert/RapidSSL) -- bring-your-own-
# cert per this feature's scope (no automated ACME/Let's Encrypt provisioning).
# Certificate/key live at lab-control-ui/nginx/certs/ on the host, gitignored,
# mounted read-only below via docker-compose.yml's `nginx.volumes`.

server {
    listen 80;
    server_name hapilab.intellisoftkenya.com;

    # Plain HTTP is redirect-only -- the app's session cookie is issued
    # Secure (LAB_UI_COOKIE_SECURE=true, see docker-compose.yml) once TLS is
    # live, so a plain-HTTP session would silently never receive it back.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name hapilab.intellisoftkenya.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # SSE log stream (GET /api/runs/:actionRunId/stream, contracts/api.md):
    # matched separately because it needs proxy buffering OFF (otherwise
    # nginx holds the whole response until the connection closes, defeating
    # FR-007's "incrementally, not only after the action completes") and a
    # much longer read timeout (a benchmark run's stream can legitimately
    # stay open for tens of minutes -- see specs/009-lab-control-ui/
    # quickstart.md Scenario 4's real ~42-minute benchmark run).
    location ~ ^/api/runs/[^/]+/stream$ {
        proxy_pass http://host.docker.internal:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
    }

    # Everything else: the JSON API and the static frontend the app serves
    # itself (app.ts's express.static + SPA fallback).
    location / {
        proxy_pass http://host.docker.internal:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
