# Additive Helm values overlay for the PgBouncer-pooled connection tier
# (specs/007-pgbouncer-connection-pooling). Applied ONLY when
# enable_pgbouncer is true, as an EXTRA --values file layered after the
# base charts/hapi-fhir-deploy/values.yaml (which this file never
# modifies) and before the Ansible-rendered runtime values file, which
# supplies the actual datasource host/port pointed at the PgBouncer
# Service (see ansible/templates/hapi-fhir-values.runtime.yaml.j2).
#
# See specs/007-pgbouncer-connection-pooling/contracts/helm-values-overlay.md.
hapi-fhir-jpaserver:
  # extraConfig is a single scalar in the base chart's values, so this
  # overlay must repeat the full block rather than partially patch it.
  # Only spring.datasource.hikari.* differs from the base file: the pooled
  # tier can safely raise Hikari's pool size because PgBouncer, not Hikari,
  # now bounds the real number of PostgreSQL backend connections.
  extraConfig: |
    spring:
      lifecycle:
        timeout-per-shutdown-phase: 30s
      datasource:
        url: ${HAPI_FHIR_POSTGRES_JDBC_URL}
        username: ${HAPI_FHIR_POSTGRES_USERNAME}
        password: ${HAPI_FHIR_POSTGRES_PASSWORD}
        driverClassName: org.postgresql.Driver
        hikari:
          minimumIdle: 4
          maximumPoolSize: 20
          data-source-properties:
            # PgBouncer transaction-mode pooling has documented friction with
            # JDBC server-side prepared statements (research.md Decision 3):
            # a statement prepared on one backend connection may not exist on
            # the next one a transaction is routed to. The pinned PgBouncer
            # image (edoburu/pgbouncer:v1.25.2-p0, >= 1.21) supports
            # protocol-level prepared-statement pooling via
            # MAX_PREPARED_STATEMENTS (ansible/group_vars/lab.yml), which
            # should make server-side prepare safe.
            #
            # T028 live validation (docs/autoscaling.md "Prepared
            # statements"): the guaranteed-safe prepareThreshold=0 fallback
            # was kept until a live cluster was available to test this.
            # Motivation: a live 'load'-profile benchmark at replica AND
            # connection parity with the native tier still ran ~5x worse on
            # p50/p95 latency and ~3x worse on failure rate than native, with
            # prepareThreshold=0 the only remaining unexplained variable
            # (connection count was ruled out first). Re-enabling PgJDBC's
            # default threshold (5) to test whether disabling server-side
            # prepare was itself the cost. REQUIRES watching HAPI FHIR/
            # PostgreSQL logs for "prepared statement ... does not exist"
            # during validation -- if that appears even once, this is unsafe
            # under transaction pooling and must revert to 0 immediately,
            # regardless of any latency improvement.
            prepareThreshold: 5
      jpa:
        properties:
          hibernate.dialect: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect
          hibernate.search.enabled: false
    management:
      endpoint:
        health:
          probes:
            enabled: true
      endpoints:
        web:
          exposure:
            include: health,prometheus
