apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: hapi-fhir-jpaserver
  namespace: fhir
  labels:
    app.kubernetes.io/name: hapi-fhir-jpaserver
    app.kubernetes.io/instance: hapi-fhir
    app.kubernetes.io/component: fhir-server
    app.kubernetes.io/part-of: hapi-fhir
  annotations:
    hapi-fhir-deploy.moshonk.dev/issue: "37"
    hapi-fhir-deploy.moshonk.dev/spec: "007-pgbouncer-connection-pooling"
    hapi-fhir-deploy.moshonk.dev/connection-budget: "pgbouncer_server_connections = 20*2 = 40 real PostgreSQL connections total (pool_mode=transaction, multiplexed regardless of replica count). The originally-committed floor(pgbouncer_max_client_conn=1000 / hikari_maximum_pool_size=20)=50 bounds PgBouncer's CLIENT-accept capacity, not real backend throughput -- root-caused live (this session): 5-shard 'load'-profile benchmark against maxReplicaCount 50 collapsed throughput ~6x, p50 latency ~37x, true failure rate ~13x vs the native (maxReplicaCount 5) tier, with PgBouncer's own stats log showing multi-second average client wait times for a free server connection. maxReplicaCount lowered to 5 (native tier's proven-safe ceiling, see hapi-fhir-scaledobject.yaml) as a conservative starting point pending further load-test evidence of how far replica count can safely rise above it."
    hapi-fhir-deploy.moshonk.dev/provisional: "maxReplicaCount and the RPS threshold are provisional pending T4 (10,000 concurrent user) load-test evidence, per specs/007-pgbouncer-connection-pooling/spec.md SC-002/SC-003. Raise incrementally (5 -> 8 -> 10 -> ...) with a load test at each step, not back to 50 in one jump -- see the connection-budget annotation above for why 50 already failed."
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hapi-fhir-hapi-fhir-jpaserver
  pollingInterval: 30
  cooldownPeriod: 300
  minReplicaCount: 2
  maxReplicaCount: 5
  advanced:
    horizontalPodAutoscalerConfig:
      name: hapi-fhir-jpaserver
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Percent
              value: 50
              periodSeconds: 60
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Pods
              value: 1
              periodSeconds: 60
            - type: Percent
              value: 100
              periodSeconds: 60
          selectPolicy: Max
  triggers:
    - type: prometheus
      name: hapi-fhir-rps
      metricType: AverageValue
      metadata:
        serverAddress: http://prometheus-operated.monitoring.svc.cluster.local:9090
        # job label is the scraped Service name (hapi_service_name in
        # ansible/group_vars/lab.yml): the upstream HAPI FHIR chart's
        # ServiceMonitor template has no jobLabel/relabelings support, so
        # Prometheus Operator's default __meta_kubernetes_service_name
        # relabeling is what actually sets this value, not "hapi-fhir-actuator".
        query: sum(rate(http_server_requests_seconds_count{job="hapi-fhir-hapi-fhir-jpaserver"}[2m]))
        threshold: "5"
        ignoreNullValues: "false"
    - type: cpu
      name: hapi-fhir-cpu
      metricType: Utilization
      metadata:
        value: "70"
