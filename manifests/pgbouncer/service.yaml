apiVersion: v1
kind: Service
metadata:
  name: hapi-fhir-pgbouncer
  namespace: fhir
  labels:
    app.kubernetes.io/name: hapi-fhir-pgbouncer
    app.kubernetes.io/part-of: hapi-fhir
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: hapi-fhir-pgbouncer
    app.kubernetes.io/part-of: hapi-fhir
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
