# Distributed k6 load generation, per
# specs/008-echis-workload-benchmark/contracts/shard-job.md and issue #46 (US4).
#
# This file uses <ANGLE_BRACKET> placeholder tokens that MUST be substituted
# before `kubectl apply` (e.g. via `envsubst`, or a future `scripts/lab`
# wiring step -- tracked as tasks.md T038, not yet implemented). See
# manifests/k6-shard-job/README.md for the required substitutions and the
# ConfigMap/PVC this manifest expects to already exist.
#
# Targets benchmarks/k6/echis_load_100.js (tasks.md T031). (It started out
# pointed at benchmarks/k6/smoke.js for de-risking the Job mechanism itself,
# before US2/US3 existed -- see git history and tasks.md T027's note.)
#
# Sharding strategy: each shard pod runs the SAME, UNMODIFIED tier script in
# full (echis_load_100.js hardcodes its own VU stage targets, 25->50->100 --
# it is not parametrized per-shard). Aggregate concurrency is the chosen
# script's own VU target multiplied by SHARD_COUNT, per this contract's
# Independent Test ("confirm the combined result matches a single-worker run
# for an equivalent SMALLER target"). E.g. SHARD_COUNT=10 with
# echis_load_100.js approximates ~1,000 aggregate VUs (a distributed
# stand-in for T3); SHARD_COUNT=1000 approximates ~100,000 (T5) -- pick
# whichever committed echis_load_*.js script's own target, multiplied by
# SHARD_COUNT, is closest to the concurrency you actually want, and swap the
# script filename in this manifest's args/ConfigMap items accordingly.
apiVersion: batch/v1
kind: Job
metadata:
  name: echis-k6-shard-job
  namespace: fhir
  labels:
    app.kubernetes.io/name: echis-k6-shard-job
    app.kubernetes.io/part-of: hapi-fhir
  annotations:
    hapi-fhir-deploy.moshonk.dev/issue: "46"
    hapi-fhir-deploy.moshonk.dev/contract: specs/008-echis-workload-benchmark/contracts/shard-job.md
spec:
  completionMode: Indexed
  parallelism: <SHARD_COUNT>
  completions: <SHARD_COUNT>
  # backoffLimitPerIndex (not the old single job-wide backoffLimit): each
  # shard index gets its own retry budget, so one shard's k6 threshold
  # breach (a REAL, expected outcome under heavy load -- the whole point of
  # a stress-scale run) doesn't invalidate the other N-1 shards' results.
  # Root-caused live: a 10-shard run where 3 shards legitimately breached
  # their http_req_duration/http_req_failed thresholds under sustained
  # overload hit the OLD job-wide backoffLimit, which marked the ENTIRE Job
  # Failed and deleted the other 7 shards' pods -- discarding their
  # already-complete, perfectly valid results along with the 3 that failed.
  # maxFailedIndexes tolerates that many shards failing before the overall
  # Job is marked Failed; <MAX_FAILED_SHARDS> is ~30% of shard count
  # (scripts/lab's cmd_benchmark_in_cluster), reflecting "some shards
  # breaching thresholds under stress is expected and shouldn't discard
  # everyone else's data" without masking a truly systemic failure.
  #
  # backoffLimitPerIndex is deliberately 0, not 1: root-caused live (a
  # second incident, after the one above) that a threshold-breach exit
  # after a shard's FULL 42-minute run already IS a complete, valid result
  # -- k6 already wrote its summary JSON before exiting non-zero. A retry
  # doesn't "fix" anything here (there's nothing broken to fix), it just
  # re-runs an already-answered 42-minute question from scratch AND races
  # a fresh pod's own SIGTERM-triggered partial summary against the
  # original complete one on the SAME output path -- whoever's operator
  # deletes the Job to collect results loses the good data to the retry
  # pod's ~100-second partial one. 0 retries removes that race entirely.
  backoffLimitPerIndex: 0
  maxFailedIndexes: <MAX_FAILED_SHARDS>
  template:
    metadata:
      labels:
        app.kubernetes.io/name: echis-k6-shard-job
        app.kubernetes.io/part-of: hapi-fhir
    spec:
      restartPolicy: Never
      # Root-caused live, in two layers:
      #   1. The grafana/k6 image bakes in `USER k6` (uid 12345) -- NOT
      #      root, contrary to this comment's original (wrong) assumption
      #      that a bare image with no securityContext defaults to root.
      #      A fresh Filestore export's root directory is owned root:root
      #      mode 0755, so uid 12345 had no write access at all -- nothing
      #      to do with NFS behavior, just an ordinary POSIX permission
      #      check. `securityContext.runAsUser/runAsGroup: 0` below
      #      overrides the image's own USER directive so this
      #      initContainer actually runs as root.
      #   2. Separately (and still worth keeping): Filestore's default NFS
      #      export also squashes root -- remaps client uid 0 to an
      #      unprivileged anonymous user server-side -- which would have
      #      blocked a genuinely-root process too. infra/terraform/gcp
      #      main.tf's nfs_export_options sets NO_ROOT_SQUASH for this
      #      share so (1)'s fix actually has an effect.
      # Every shard failed with a permission error writing its own summary
      # JSON, discovered only after a full 42-minute run, discarding all
      # 10 shards' results, until both layers were fixed.
      initContainers:
        - name: fix-shard-output-permissions
          image: docker.io/grafana/k6:2.1.0@sha256:68e78d94140704ec4ee0cb7c5cf6cd12a32b7d310a6f98d94931ee9b0b9dc629
          command: ["sh", "-c", "chmod 0777 /shard-output"]
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: shard-output
              mountPath: /shard-output
      containers:
        - name: k6
          image: docker.io/grafana/k6:2.1.0@sha256:68e78d94140704ec4ee0cb7c5cf6cd12a32b7d310a6f98d94931ee9b0b9dc629
          command: ["k6", "run"]
          args:
            - "-e"
            - "FHIR_BASE_URL=<FHIR_BASE_URL>"
            - "-e"
            - "K6_FHIR_SUMMARY_PATH=/shard-output/shard-$(SHARD_INDEX)-k6-fhir-summary.json"
            # Streams this shard's own live metrics to Prometheus remote-write
            # (K6_PROMETHEUS_RW_SERVER_URL below), same as a local (non
            # --in-cluster) benchmark's "Live k6 metrics in Grafana" --
            # except no port-forward is needed here, since this pod already
            # runs inside the cluster and can reach the Service by its
            # cluster-DNS name directly (scripts/lab's cmd_benchmark_in_cluster
            # sets that URL).
            - "--out"
            - "experimental-prometheus-rw"
            - "--summary-export"
            - "/shard-output/shard-$(SHARD_INDEX)-k6-summary.json"
            - "/scripts/echis_load_100.js"
          env:
            - name: SHARD_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: "metadata.annotations['batch.kubernetes.io/job-completion-index']"
            - name: SHARD_COUNT
              value: "<SHARD_COUNT>"
            - name: K6_PROMETHEUS_RW_SERVER_URL
              value: "<PROMETHEUS_REMOTE_WRITE_URL>"
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: shard-output
              mountPath: /shard-output
      volumes:
        - name: scripts
          configMap:
            name: <K6_SCRIPTS_CONFIGMAP>
            defaultMode: 0555
            items:
              - key: echis_load_100.js
                path: echis_load_100.js
              - key: fhir_benchmark.js
                path: lib/fhir_benchmark.js
        - name: shard-output
          persistentVolumeClaim:
            claimName: <SHARD_OUTPUT_PVC>
