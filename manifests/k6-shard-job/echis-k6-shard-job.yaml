# Distributed k6 load generation, per
# specs/008-echis-workload-benchmark/contracts/shard-job.md and issue #46 (US4).
#
# This file uses <ANGLE_BRACKET> placeholder tokens that MUST be substituted
# before `kubectl apply` (e.g. via `envsubst`, or a future `scripts/lab`
# wiring step -- tracked as tasks.md T038, not yet implemented). See
# manifests/k6-shard-job/README.md for the required substitutions and the
# ConfigMap/PVC this manifest expects to already exist.
#
# De-risking stage (tasks.md T027): targets benchmarks/k6/smoke.js (the
# existing generic 1-VU/1-minute profile), to validate the Job mechanism
# itself (indexed completion, per-shard output addressing, merge-script
# summation via scripts/merge_k6_shards.rb) independent of the eCHIS
# workload. tasks.md T031 swaps this to an echis_load_*.js tier script.
apiVersion: batch/v1
kind: Job
metadata:
  name: echis-k6-shard-job
  namespace: fhir
  labels:
    app.kubernetes.io/name: echis-k6-shard-job
    app.kubernetes.io/part-of: hapi-fhir
  annotations:
    hapi-fhir-deploy.moshonk.dev/issue: "46"
    hapi-fhir-deploy.moshonk.dev/contract: specs/008-echis-workload-benchmark/contracts/shard-job.md
spec:
  completionMode: Indexed
  parallelism: <SHARD_COUNT>
  completions: <SHARD_COUNT>
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: echis-k6-shard-job
        app.kubernetes.io/part-of: hapi-fhir
    spec:
      restartPolicy: Never
      containers:
        - name: k6
          image: docker.io/grafana/k6:2.1.0@sha256:68e78d94140704ec4ee0cb7c5cf6cd12a32b7d310a6f98d94931ee9b0b9dc629
          command: ["k6", "run"]
          args:
            - "-e"
            - "FHIR_BASE_URL=<FHIR_BASE_URL>"
            - "-e"
            - "K6_FHIR_SUMMARY_PATH=/shard-output/shard-$(SHARD_INDEX)-k6-fhir-summary.json"
            - "--summary-export"
            - "/shard-output/shard-$(SHARD_INDEX)-k6-summary.json"
            - "/scripts/smoke.js"
          env:
            - name: SHARD_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: "metadata.annotations['batch.kubernetes.io/job-completion-index']"
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: shard-output
              mountPath: /shard-output
      volumes:
        - name: scripts
          configMap:
            name: <K6_SCRIPTS_CONFIGMAP>
            defaultMode: 0555
            items:
              - key: smoke.js
                path: smoke.js
              - key: fhir_benchmark.js
                path: lib/fhir_benchmark.js
        - name: shard-output
          persistentVolumeClaim:
            claimName: <SHARD_OUTPUT_PVC>
