# Lean Synthea settings for large benchmark seed runs.
#
# Patient and Encounter are always included by Synthea. The included resource
# list keeps the other resource types exercised by benchmarks/k6/lib/fhir_benchmark.js
# while avoiding unrelated FHIR resources that dominate local generation size.
exporter.fhir.export = true
exporter.fhir.transaction_bundle = true
exporter.fhir.bulk_data = false
exporter.fhir.use_us_core_ig = false
exporter.fhir.included_resources = Observation,Condition
exporter.years_of_history = 1
